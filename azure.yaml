# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: clinical-agentops-demo
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"

infra:
  provider: terraform
  path: infra

services:
  ai-project:
    host: azure.ai.project

  clinical-agent:
    project: agent
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: clinical-agent
    displayName: Clinical Knowledge Agent
    description: >-
      Answers clinician reference questions from a Foundry IQ knowledge base
      (MedQuAD, NIH consumer-health content) with input checks, a deterministic
      citation validator and full OpenTelemetry tracing.
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      ENABLE_INSTRUMENTATION: "true"
      ENABLE_SENSITIVE_DATA: "true"
      OTEL_SERVICE_NAME: clinical-agent
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_14
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    metadata:
      tags:
        - Clinical
        - Foundry IQ
        - Agent Framework
        - Responses Protocol

  web:
    project: web
    host: appservice
    language: py

hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/postprovision.ps1
    continueOnError: false
  postdeploy:
    shell: pwsh
    run: ./scripts/postdeploy.ps1
    continueOnError: false
