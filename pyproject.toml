[project]
name = "clinical-agentops-tools"
version = "0.1.0"
description = "Tooling for the clinical knowledge AgentOps demo: KB provisioning, release, evals, tests."
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-ai-projects>=2.6.1",
    "openai>=2.0.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["agent", "web", "evals", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data/.cache", ".azure"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
